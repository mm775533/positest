<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>核種データ 穴埋めテスト</title>
<style>
:root{
  --bg:#F5F3EE; --panel:#FFFFFF; --ink:#1D2B2E; --sub:#5C6B6E;
  --line:#DAD5C8; --accent:#2A6F72; --accent-ink:#FFFFFF;
  --ok:#2E7D4F; --ok-bg:#E6F3EA; --bad:#B23A3A; --bad-bg:#FBEAEA;
  padding-top: env(safe-area-inset-top,0px); padding-bottom: env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14201F; --panel:#1B2726; --ink:#EDEFE9; --sub:#9AAAA8;
    --line:#33403E; --accent:#57B8B3; --accent-ink:#0F1817;
    --ok:#6FD08C; --ok-bg:#1C3327; --bad:#F08C8C; --bad-bg:#3A2222;
  }
}
:root[data-theme="dark"]{
  --bg:#14201F; --panel:#1B2726; --ink:#EDEFE9; --sub:#9AAAA8;
  --line:#33403E; --accent:#57B8B3; --accent-ink:#0F1817;
  --ok:#6FD08C; --ok-bg:#1C3327; --bad:#F08C8C; --bad-bg:#3A2222;
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Hiragino Sans","Yu Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
  line-height:1.6;
}
.wrap{max-width:820px; margin:0 auto; padding:28px 16px 60px;}
header{margin-bottom:20px;}
h1{font-size:1.4rem; margin:0 0 4px; letter-spacing:.02em;}
.lead{color:var(--sub); font-size:.92rem; margin:0;}
.tabs{display:flex; gap:6px; margin:20px 0 14px; flex-wrap:wrap;}
.tab{
  padding:8px 14px; border-radius:20px; border:1px solid var(--line);
  background:var(--panel); color:var(--ink); font-size:.85rem; cursor:pointer;
}
.tab[aria-selected="true"]{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
section.table-section{display:none;}
section.table-section.active{display:block;}
.card{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px;}
.tbl-scroll{overflow-x:auto;}
table{border-collapse:collapse; width:100%; min-width:520px; font-size:.88rem;}
th,td{border-bottom:1px solid var(--line); padding:8px 6px; text-align:left; vertical-align:middle;}
th{color:var(--sub); font-weight:600; font-size:.78rem;}
td.nuclide{font-variant-numeric:tabular-nums; font-weight:600; white-space:nowrap;}
input.blank{
  width:100%; min-width:90px; padding:6px 8px; border:1px solid var(--line);
  border-radius:6px; background:var(--bg); color:var(--ink); font-size:.88rem;
}
input.blank:focus{outline:2px solid var(--accent); outline-offset:1px;}
input.blank.ok{background:var(--ok-bg); border-color:var(--ok); color:var(--ink);}
input.blank.bad{background:var(--bad-bg); border-color:var(--bad); color:var(--ink);}
.ans-hint{font-size:.76rem; color:var(--bad); margin-top:2px;}
.controls{display:flex; gap:10px; margin:18px 0; flex-wrap:wrap; align-items:center;}
button.act{
  padding:10px 18px; border-radius:8px; border:none; background:var(--accent);
  color:var(--accent-ink); font-size:.9rem; cursor:pointer;
}
button.act.secondary{background:transparent; border:1px solid var(--line); color:var(--ink);}
.mode-toggle{display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden;}
.mode-toggle button{
  padding:8px 14px; border:none; background:var(--panel); color:var(--ink);
  font-size:.85rem; cursor:pointer;
}
.mode-toggle button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink);}
.choice-group{display:flex; flex-wrap:wrap; gap:6px; min-width:160px;}
.choice-btn{
  padding:6px 10px; border:1px solid var(--line); border-radius:6px;
  background:var(--bg); color:var(--ink); font-size:.82rem; cursor:pointer;
}
.choice-btn[aria-pressed="true"]{border-color:var(--accent); background:var(--accent); color:var(--accent-ink);}
.choice-btn.ok{background:var(--ok-bg); border-color:var(--ok); color:var(--ink);}
.choice-btn.bad{background:var(--bad-bg); border-color:var(--bad); color:var(--ink);}
.score{font-size:1rem; font-weight:600; margin:0 0 10px;}
.score .num{color:var(--accent);}
footer.note{color:var(--sub); font-size:.78rem; margin-top:28px;}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>核種データ 穴埋めテスト</h1>
  <p class="lead">核種名をヒントに、空欄になっているデータを入力してください。入力後「採点する」を押すと正誤が色分けされます。</p>
</header>

<div class="tabs" role="tablist">
  <button class="tab" data-target="t1" aria-selected="true">シングルフォトン放出核種</button>
  <button class="tab" data-target="t2" aria-selected="false">ポジトロン放出核種</button>
  <button class="tab" data-target="t3" aria-selected="false">RIの製造法</button>
</div>

<section id="t1" class="table-section active">
  <div class="card">
    <div class="score" id="score1">未採点</div>
    <div class="tbl-scroll">
      <table>
        <thead><tr><th>核種</th><th>半減期(約)</th><th>壊変方式</th><th>γ・特性線エネルギー(keV)</th></tr></thead>
        <tbody id="body1"></tbody>
      </table>
    </div>
  </div>
</section>

<section id="t2" class="table-section">
  <div class="card">
    <div class="score" id="score2">未採点</div>
    <div class="tbl-scroll">
      <table>
        <thead><tr><th>核種</th><th>半減期</th><th>消滅光子エネルギー(MeV)</th></tr></thead>
        <tbody id="body2"></tbody>
      </table>
    </div>
  </div>
</section>

<section id="t3" class="table-section">
  <div class="card">
    <div class="score" id="score3">未採点</div>
    <div class="tbl-scroll">
      <table>
        <thead><tr><th>核種</th><th>製造法</th></tr></thead>
        <tbody id="body3"></tbody>
      </table>
    </div>
  </div>
</section>

<div class="controls">
  <div class="mode-toggle">
    <button id="modeInput" aria-pressed="true">入力式</button>
    <button id="modeChoice" aria-pressed="false">選択式</button>
  </div>
  <button class="act" id="gradeBtn">採点する</button>
  <button class="act secondary" id="retryBtn">やり直す（空欄を入れ替え）</button>
</div>

<footer class="note">全問正解を目指して、表を見ずに何度も挑戦してみましょう。</footer>
</div>

<script>
const T1 = [
  ["67Ga","3.2d","EC","93, 185, 300"],
  ["81mKr","13s","IT","190"],
  ["99mTc","6h","IT","141"],
  ["111In","2.8d","EC","171, 245"],
  ["123I","13.2h","EC","159"],
  ["131I","8d","β⁻","365"],
  ["133Xe","5.3d","β⁻","81"],
  ["201Tl","73h","EC","135, 167 (Hg特性X線利用：70)"],
  ["125I","60d","EC","30"],
];
const T2 = [
  ["11C","20min","0.51"],
  ["13N","10min","0.51"],
  ["15O","2min","0.51"],
  ["18F","110min","0.51"],
  ["68Ga","68min","0.51"],
];
const T3 = [
  ["67Ga","サイクロトロン"],
  ["81mKr","ジェネレータ"],
  ["99mTc","ジェネレータ"],
  ["111In","サイクロトロン"],
  ["123I","サイクロトロン"],
  ["131I","原子炉"],
  ["133Xe","原子炉"],
  ["201Tl","サイクロトロン"],
  ["99Mo","原子炉"],
  ["81Rb","サイクロトロン"],
  ["125I","原子炉"],
  ["15O","サイクロトロン"],
  ["13N","サイクロトロン"],
  ["11C","サイクロトロン"],
  ["18F","サイクロトロン"],
  ["68Ge/68Ga","68Ge(270d) → 68Ga(68min) ジェネレータ"],
];

function norm(s){
  return s.replace(/[，、]/g,",").replace(/\s+/g,"").replace(/⁻/g,"-").toLowerCase();
}

let mode = "input"; // "input" | "choice"

function shuffle(arr){ return arr.slice().sort(()=>Math.random()-0.5); }

function distractorsFor(rows, colIndex, correct, n){
  const pool = [...new Set(rows.map(r => r[colIndex]).filter(v => v !== correct))];
  return shuffle(pool).slice(0, n);
}

function buildTable(tbodyId, rows, blankCols){
  const tbody = document.getElementById(tbodyId);
  tbody.innerHTML = "";
  rows.forEach((row, ri) => {
    const tr = document.createElement("tr");
    const nuclideTd = document.createElement("td");
    nuclideTd.className = "nuclide";
    nuclideTd.textContent = row[0];
    tr.appendChild(nuclideTd);
    const otherCols = row.length - 1;
    let toBlank = blankCols[ri];
    for(let c = 1; c <= otherCols; c++){
      const td = document.createElement("td");
      if(toBlank.includes(c)){
        if(mode === "input"){
          const inp = document.createElement("input");
          inp.className = "blank";
          inp.type = "text";
          inp.dataset.answer = row[c];
          inp.autocomplete = "off";
          td.appendChild(inp);
        } else {
          const correct = row[c];
          const distractors = distractorsFor(rows, c, correct, 3);
          const options = shuffle([correct, ...distractors]);
          const group = document.createElement("div");
          group.className = "choice-group";
          group.dataset.answer = correct;
          options.forEach(opt => {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "choice-btn";
            btn.textContent = opt;
            btn.dataset.value = opt;
            btn.setAttribute("aria-pressed","false");
            btn.addEventListener("click", () => {
              group.querySelectorAll(".choice-btn").forEach(b => {
                b.setAttribute("aria-pressed", b === btn ? "true" : "false");
                b.classList.remove("ok","bad");
              });
              group.dataset.selected = opt;
            });
            group.appendChild(btn);
          });
          td.appendChild(group);
        }
      } else {
        td.textContent = row[c];
      }
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  });
}

function randomBlanks(rows){
  // for each row, randomly blank 1~2 of the non-nuclide columns
  return rows.map(row => {
    const n = row.length - 1;
    const cols = Array.from({length:n}, (_,i)=>i+1);
    cols.sort(()=>Math.random()-0.5);
    const count = n <= 2 ? 1 : (Math.random() < 0.5 ? 1 : 2);
    return cols.slice(0, count);
  });
}

let blanks1, blanks2, blanks3;

function renderAll(){
  blanks1 = randomBlanks(T1);
  blanks2 = randomBlanks(T2);
  blanks3 = randomBlanks(T3);
  buildTable("body1", T1, blanks1);
  buildTable("body2", T2, blanks2);
  buildTable("body3", T3, blanks3);
  ["score1","score2","score3"].forEach(id => document.getElementById(id).textContent = "未採点");
}

function gradeTable(tbodyId, scoreId){
  let total = 0, correct = 0;
  if(mode === "input"){
    const inputs = document.querySelectorAll("#"+tbodyId+" input.blank");
    total = inputs.length;
    inputs.forEach(inp => {
      const given = norm(inp.value);
      const ans = norm(inp.dataset.answer);
      const isOk = given.length > 0 && given === ans;
      inp.classList.remove("ok","bad");
      inp.classList.add(isOk ? "ok" : "bad");
      if(isOk) correct++;
      let hint = inp.parentElement.querySelector(".ans-hint");
      if(!isOk){
        if(!hint){
          hint = document.createElement("div");
          hint.className = "ans-hint";
          inp.parentElement.appendChild(hint);
        }
        hint.textContent = "正解: " + inp.dataset.answer;
      } else if(hint){
        hint.remove();
      }
    });
  } else {
    const groups = document.querySelectorAll("#"+tbodyId+" .choice-group");
    total = groups.length;
    groups.forEach(group => {
      const ans = group.dataset.answer;
      const selected = group.dataset.selected;
      const isOk = selected === ans;
      if(isOk) correct++;
      group.querySelectorAll(".choice-btn").forEach(btn => {
        btn.classList.remove("ok","bad");
        if(btn.dataset.value === ans) btn.classList.add("ok");
        else if(btn.dataset.value === selected) btn.classList.add("bad");
      });
    });
  }
  document.getElementById(scoreId).innerHTML =
    "正解 <span class='num'>" + correct + "</span> / " + total;
}

document.getElementById("gradeBtn").addEventListener("click", () => {
  gradeTable("body1","score1");
  gradeTable("body2","score2");
  gradeTable("body3","score3");
});

document.getElementById("retryBtn").addEventListener("click", renderAll);

document.getElementById("modeInput").addEventListener("click", () => {
  mode = "input";
  document.getElementById("modeInput").setAttribute("aria-pressed","true");
  document.getElementById("modeChoice").setAttribute("aria-pressed","false");
  renderAll();
});
document.getElementById("modeChoice").addEventListener("click", () => {
  mode = "choice";
  document.getElementById("modeChoice").setAttribute("aria-pressed","true");
  document.getElementById("modeInput").setAttribute("aria-pressed","false");
  renderAll();
});

document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected","false"));
    document.querySelectorAll(".table-section").forEach(s => s.classList.remove("active"));
    tab.setAttribute("aria-selected","true");
    document.getElementById(tab.dataset.target).classList.add("active");
  });
});

renderAll();
</script>
</body>
</html>
